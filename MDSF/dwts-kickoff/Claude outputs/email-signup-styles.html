<script type="text/javascript">
  (function () {
    var overlay = document.getElementById("mdsfSignupOverlay");
    var openBtn = document.getElementById("mdsfSignupOpen");
    var closeBtn = document.getElementById("mdsfSignupClose");
    // Move the pop-up to the end of the page so the site's layout can't clip it
    document.body.appendChild(overlay);
    var openPopup = function () {
      overlay.classList.add("is-open");
      overlay.setAttribute("aria-hidden", "false");
      document.body.classList.add("mdsf-signup-locked");
      setTimeout(function () {
        var first = overlay.querySelector("#first-name");
        if (first) first.focus();
      }, 350);
    };
    var closePopup = function () {
      overlay.classList.remove("is-open");
      overlay.setAttribute("aria-hidden", "true");
      document.body.classList.remove("mdsf-signup-locked");
      openBtn.focus();
    };
    openBtn.onclick = (e) => { e.preventDefault(); openPopup(); };
    closeBtn.onclick = (e) => { e.preventDefault(); closePopup(); };
    overlay.onclick = (e) => { if (e.target === overlay) closePopup(); };
    overlay.onkeydown = (e) => { if (e.key === "Escape") closePopup(); };
  })();
</script>
