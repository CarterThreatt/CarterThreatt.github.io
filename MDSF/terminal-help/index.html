<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Terminal Help · Marlie’s Closet</title>

<!-- Web clip (Add to Home Screen) settings -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Help">
<meta name="theme-color" content="#f6f2ff">
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" href="images/Help%20App%20Icon.png">
<link rel="icon" type="image/png" href="images/Help%20App%20Icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --purple: #8d6cf7;
    --purple-deep: #6b48e0;
    --plum: #302237;
    --ink: #1b1533;
    --soft: #6a6383;
    --lav: #f6f2ff;
    --lav-2: #ece5ff;
    --line: #e4dcf7;
    --white: #ffffff;
    --warn: #b4232f;
    --warn-bg: #fff1f2;
    --warn-line: #f6c5ca;
    --ok: #1f7a4d;
    --radius: 18px;
  }
  *, *::before, *::after{ box-sizing: border-box; }
  html{ -webkit-text-size-adjust: 100%; }
  body{
    margin: 0; min-height: 100vh;
    font-family: "Jost", "Helvetica Neue", Arial, sans-serif; font-weight: 400;
    color: var(--ink); line-height: 1.55;
    background:
      radial-gradient(ellipse at 50% -10%, #e6dcff 0%, rgba(230,220,255,0) 55%),
      var(--lav);
    -webkit-tap-highlight-color: transparent;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  button{ font: inherit; color: inherit; }
  .wrap{ max-width: 860px; margin: 0 auto; padding: 34px 22px 50px; }

  /* ---------- Header ---------- */
  .top{ display: flex; align-items: center; gap: 18px; margin: 0 0 30px; }
  .top img{ width: 64px; height: 64px; border-radius: 16px; box-shadow: 0 8px 22px rgba(107,72,224,.28); flex: none; }
  .eyebrow{ margin: 0 0 2px; font-size: 12px; font-weight: 500; letter-spacing: .3em; text-transform: uppercase; color: var(--purple); }
  h1{ margin: 0; font-family: "Italiana", Georgia, serif; font-weight: 400; font-size: clamp(32px, 5vw, 44px); line-height: 1.05; color: var(--ink); }

  /* ---------- Topic list ---------- */
  .intro{ margin: 0 0 18px; font-size: 18px; color: var(--soft); }
  .topics{ display: grid; gap: 14px; }
  .topic{
    display: flex; align-items: center; gap: 18px; width: 100%;
    padding: 20px 22px; text-align: left; cursor: pointer;
    background: var(--white); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: 0 10px 28px rgba(48,34,55,.06);
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .topic:active{ transform: scale(.985); }
  .topic:hover{ border-color: #cbbcf7; box-shadow: 0 14px 32px rgba(107,72,224,.12); }
  .topic-num{
    flex: none; width: 52px; height: 52px; border-radius: 14px;
    display: grid; place-items: center;
    background: var(--lav-2); color: var(--purple-deep); font-size: 24px;
  }
  .topic-num svg{ width: 28px; height: 28px; }
  .topic-text{ flex: 1; min-width: 0; }
  .topic-title{ display: block; font-size: 21px; font-weight: 500; line-height: 1.3; color: var(--ink); }
  .topic-sub{ display: block; margin-top: 2px; font-size: 15.5px; color: var(--soft); }
  .chev{ flex: none; width: 24px; height: 24px; color: var(--purple); }

  /* ---------- Detail view ---------- */
  .back{
    display: inline-flex; align-items: center; gap: 8px; margin: 0 0 22px;
    padding: 10px 18px 10px 12px; border-radius: 999px; cursor: pointer;
    background: var(--white); border: 1px solid var(--line);
    font-size: 16px; font-weight: 500; color: var(--purple-deep);
    box-shadow: 0 4px 14px rgba(48,34,55,.06);
  }
  .back svg{ width: 20px; height: 20px; }
  .detail-head{ margin: 0 0 22px; }
  .detail-head h2{ margin: 0; font-family: "Italiana", Georgia, serif; font-weight: 400; font-size: clamp(30px, 4.6vw, 40px); line-height: 1.1; }
  .detail-head p{ margin: 8px 0 0; font-size: 17px; color: var(--soft); }

  .video{
    margin: 0 0 24px; border-radius: var(--radius); overflow: hidden;
    background: var(--plum); aspect-ratio: 16 / 9;
    box-shadow: 0 14px 34px rgba(48,34,55,.18);
  }
  .video video{ display: block; width: 100%; height: 100%; object-fit: contain; background: #000; }
  .video--soon{
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    aspect-ratio: auto; padding: 26px 20px;
    background: linear-gradient(135deg, #3b2b47, var(--plum));
    color: #e9e2f7; text-align: center; font-size: 16px;
  }
  .video--soon svg{ width: 36px; height: 36px; color: #b9a3ff; }

  .steps{ list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  .step{
    display: flex; gap: 16px; align-items: flex-start;
    padding: 18px 20px; background: var(--white);
    border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: 0 8px 22px rgba(48,34,55,.05);
  }
  .step-n{
    flex: none; width: 40px; height: 40px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--purple); color: #fff; font-size: 18px; font-weight: 600;
  }
  .step-body{ flex: 1; min-width: 0; padding-top: 5px; font-size: 18px; line-height: 1.55; }
  .step-body p{ margin: 0; }
  .step-body p + p{ margin-top: 8px; }
  .step-body strong{ font-weight: 600; }
  .step-note{ display: block; margin-top: 8px; font-size: 15.5px; color: var(--soft); }

  /* Highlighted "must do" step */
  .step--warn{ background: var(--warn-bg); border-color: var(--warn-line); }
  .step--warn .step-n{ background: var(--warn); }
  .tag{
    display: inline-block; margin: 0 0 6px; padding: 3px 10px; border-radius: 999px;
    background: var(--warn); color: #fff; font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase;
  }

  /* Inline pictures of what to look for */
  .look{
    display: inline-flex; align-items: center; gap: 10px; margin-top: 10px;
    padding: 8px 14px 8px 8px; border-radius: 14px; background: var(--lav); border: 1px solid var(--line);
    font-size: 15.5px; color: var(--soft);
  }
  .look img{ width: 48px; height: 48px; border-radius: 12px; display: block; }
  .ico{
    display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 9px;
    background: var(--white); border: 1px solid var(--line); color: var(--ink); vertical-align: middle;
  }
  .ico svg{ width: 20px; height: 20px; }
  .kbd{
    display: inline-block; padding: 1px 9px; border-radius: 8px;
    background: var(--lav-2); color: var(--purple-deep); font-weight: 500; white-space: nowrap;
  }

  /* Copy-able field (email, etc.) */
  .field{
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 10px;
    padding: 10px 10px 10px 16px; border-radius: 14px; background: var(--lav); border: 1px solid var(--line);
  }
  .field-label{ font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--purple); }
  .field-value{ flex: 1; min-width: 200px; font-size: 18px; font-weight: 500; word-break: break-all; }
  .copy{
    flex: none; padding: 9px 16px; border-radius: 10px; border: 0; cursor: pointer;
    background: var(--purple); color: #fff; font-size: 15px; font-weight: 500;
  }
  .copy.is-done{ background: var(--ok); }

  /* ---------- Footer ---------- */
  .help-foot{
    margin: 30px 0 0; padding: 18px 20px; border-radius: var(--radius);
    background: var(--white); border: 1px dashed #cbbcf7; text-align: center;
    font-size: 16px; color: var(--soft);
  }
  .help-foot strong{ color: var(--ink); font-weight: 500; }
  .help-foot a{ color: var(--purple-deep); font-weight: 500; text-decoration: none; }

  [hidden]{ display: none !important; }

  @media (min-width: 700px){
    .wrap{ padding: 46px 34px 60px; }
    .topic{ padding: 24px 26px; }
    .step{ padding: 20px 24px; }
  }
</style>
</head>
<body>
  <main class="wrap">
    <header class="top">
      <img src="images/Help%20App%20Icon.png" alt="">
      <div>
        <p class="eyebrow">Marlie’s Closet</p>
        <h1>Terminal Help</h1>
      </div>
    </header>

    <!-- Topic list (filled in by index.js) -->
    <section id="home">
      <p class="intro">Tap a topic for step-by-step help.</p>
      <div class="topics" id="topic-list"></div>
    </section>

    <!-- One topic's steps (filled in by index.js) -->
    <section id="detail" hidden>
      <button class="back" id="back-btn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        All help topics
      </button>
      <div id="detail-content"></div>
    </section>

    <footer class="help-foot">
      <strong>Still stuck?</strong> Contact Carter Threatt at
      <a href="mailto:cthreatt@marliedrusullivan.org">cthreatt@marliedrusullivan.org</a>
      or
      <a href="tel:+18035540556"> (803) 554-0556</a>
    </footer>
  </main>

  <script src="index.js"></script>
</body>
</html>
