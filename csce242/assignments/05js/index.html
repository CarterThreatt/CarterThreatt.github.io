<!DOCTYPE html>
<html>
    <head>
        <title>JavaScript Assignment</title>
        <link rel="stylesheet" href="styles.css">
        <meta charset="UTF-8">
    </head>
    <body>
        <div id="content">
            <header id="main-header">
                <h1>JavaScript</h1>
            </header>
            <main>
                <div class="projects">
                    <section class="project-card" id="card-speech-bubble">
                        <h3>Speech Bubble</h3>
                        <p id="p-message" class="speech-bubble"></p>
                </section>
                    <section class="project-card">
                        <h3>Beverage</h3>
                        <p>Pick your morning beverage:
                        <select id="beverage-select">
                            <option value="">Choose a beverage</option>
                            <option value="Coffee">Coffee</option>
                            <option value="Tea">Tea</option>
                            <option value="Apple Juice">Apple Juice</option>
                            <option value="Orange Juice">Orange Juice</option>
                            <option value="Milk">Milk</option>
                        </select>
                        </p>
                        <p id="beverage-result"></p>
                    </section>
                    <section class="project-card">
                    <h3>Add a Sticker</h3>
                    <div id="sticker-container">
                        <img src="images/gamecock logo.jpeg" id="sticker-image" alt="Add a sticker">
                        <span id="sticker">🔥</span>
                    </div>
                    </section>
                </div>
            </main>
        </div>
        <script src="index.js"></script>
    </body>
</html>
