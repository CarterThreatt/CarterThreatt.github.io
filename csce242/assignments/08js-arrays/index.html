<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Assignment 8 - Arrays</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <header id="main-header">
            <h1>Assignment 8 - Arrays</h1>
        </header>

        <main id= content>
            <section class= project-card>
                <h3>Pick Your Destination Type</h3>
                <p>
                    Destination Type:
                    <select id="destination-type">
                        <option value="">Select</option>
                        <option value="mountains">Mountains</option>
                        <option value="beaches">Beaches</option>
                    </select>
                </p>
            </section>

            <section id="destinations"></section>

            <section id= map-card class= project-card hidden>
                <h3 id= map-title ></h3>
                <p>
                    <iframe id= map title= Destination map width="100%" height="450" style="border:0"
                        loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
                </p>
            </section>
        </main>

        <script src="arrays.js"></script>
    </body>
</html>
